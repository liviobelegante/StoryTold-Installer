name: Linux installer checks
on:
  push:
    paths: ['linux/**', 'tests/**', '.github/workflows/linux-checks.yml']
  pull_request:
    paths: ['linux/**', 'tests/**', '.github/workflows/linux-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck desktop-file-utils
      - run: shellcheck -x -P linux linux/*.sh tests/*.sh
      - run: for file in linux/*.sh tests/*.sh; do bash -n "$file"; done
      - run: python3 -m unittest discover -s tests -v
      - run: bash tests/test_cli.sh
      - name: Resolve all selected app build dependencies
        run: |
          packages=$(python3 linux/support.py packages linux/apps.json wordcraft,gridcraft,deckcraft,pdfcraft,cadcraft,solidcraft)
          read -r -a package_list <<< "$packages"
          apt-get -s install --no-install-recommends "${package_list[@]}"
  debian-packages:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [debian:12, debian:13]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y python3
      - name: Resolve selected app headers on Debian
        shell: bash
        run: |
          packages=$(python3 linux/support.py packages linux/apps.json wordcraft,gridcraft,deckcraft,pdfcraft,cadcraft,solidcraft)
          read -r -a package_list <<< "$packages"
          apt-get -s install --no-install-recommends "${package_list[@]}"
